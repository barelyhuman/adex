name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          corepack-enable: true
          registry-url: 'https://registry.npmjs.org'

      - name: Deps
        run: |
          npm i -g corepack@latest
          corepack enable 
          pnpm i --frozen-lockfile

      - name: Test
        run: pnpm test:ci
